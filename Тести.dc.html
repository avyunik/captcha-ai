<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>CAPTCHA AI — автоматичні тести</title>
<style>
@font-face{font-family:Terminal;src:url(assets/fonts/DejaVuSans.ttf) format('truetype')}
body{margin:0;background:#020a16}
a{color:#6ee9ff}a:hover{color:#bff6ff}
</style>
</helmet>
<div style="min-height:100vh;background:#020a16;color:#e6f4ff;font-family:Terminal,'DejaVu Sans',Arial,sans-serif;padding:40px clamp(16px,5vw,64px)">
<div style="max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
<img src="assets/mascot/hud-pixel.svg" alt="" style="width:48px;height:60px;image-rendering:pixelated">
<div style="flex:1;min-width:240px">
<h1 style="margin:0;font-size:32px;color:#21dfff">Автоматичні тести CAPTCHA AI</h1>
<p style="margin:6px 0 0;color:#9eb7d2;font-size:16px">Логіка, рівні, пропуски, таймер, бали, кінцівки. Тести не змінюють збережену гру.</p>
</div>
<div style="font-size:28px;font-weight:700;color:{{ summaryColor }}">{{ summary }}</div>
</div>
<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:15px"><a href="CAPTCHA-AI.dc.html">← До гри</a><a href="assets/preview.html">Галерея асетів</a></div>
<div style="display:flex;flex-direction:column;gap:6px">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
<div style="display:grid;grid-template-columns:110px 34px minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 16px;background:#0a1626;border:1px solid #1b3550;border-radius:8px;font-size:16px">
<span style="color:#7edbff;font-size:13px;letter-spacing:.05em;text-transform:uppercase">{{ r.group }}</span>
<span style="font-weight:700;color:{{ r.color }}">{{ r.mark }}</span>
<span style="color:#dcebf8">{{ r.name }} <span style="color:#ff5269">{{ r.detail }}</span></span>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { results: null, error: '' };
  componentDidMount() {
    import(new URL('game/tests.js', document.baseURI).href)
      .then((m) => {
        const results = m.runTests();
        const failed = results.filter((r) => !r.ok);
        console.log(`CAPTCHA AI tests: ${results.length - failed.length}/${results.length} passed`);
        failed.forEach((f) => console.warn('FAILED:', f.group, f.name, f.detail));
        this.setState({ results });
      })
      .catch((e) => { console.error(e); this.setState({ error: String(e.message) }); });
  }
  renderVals() {
    const res = this.state.results || [];
    const passed = res.filter((r) => r.ok).length;
    return {
      summary: this.state.error ? 'Помилка: ' + this.state.error : this.state.results ? `${passed} / ${res.length} пройдено` : 'Виконуємо…',
      summaryColor: this.state.results && passed === res.length ? '#36efa6' : '#ffa531',
      rows: res.map((r) => ({ ...r, mark: r.ok ? '✓' : '✗', color: r.ok ? '#36efa6' : '#ff5269' })),
    };
  }
}
</script>
</body>
</html>
